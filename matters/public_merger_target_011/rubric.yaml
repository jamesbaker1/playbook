    settlement_concepts: ["disproportionately", "comparable"]
    settlement_critical_failure_patterns: ["whether or not.*disproportion"]
  - id: ordinary_course_consent
    anchor: "merger §5.1"
    severity: high
    base_points: 1.0
    severity_points: 0.25
    citation_points: 0.25
    concept_points: 0.5
    quote_points: 0.25
    redline_points: 0.25
    settlement_points: 0.75
