    redline_concepts: ["not unreasonably withheld", "emergency"]
    redline_critical_failure_patterns: ["target.*sole discretion"]
    settlement_concepts: ["not unreasonably withheld", "emergency"]
  - id: matching_period
    anchor: "merger §5.3"
    severity: medium
    base_points: 1.0
    severity_points: 0.25
    citation_points: 0.25
    concept_points: 0.5
    quote_points: 0.25
