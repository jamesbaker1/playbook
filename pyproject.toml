[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "playbook-legal"
version = "0.4.0"
description = "An open environment for evaluating and training AI agents on realistic legal work."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [{ name = "James Baker" }]
dependencies = ["PyYAML>=6.0"]
keywords = ["legal-ai", "reinforcement-learning", "agents", "evaluation", "contracts"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://jamesbaker1.github.io/playbook/"
Repository = "https://github.com/jamesbaker1/playbook"
Issues = "https://github.com/jamesbaker1/playbook/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "markdown>=3.5"]
baselines = ["openai>=1.40"]
gym = ["gymnasium>=1.0"]
train = ["datasets>=3", "transformers>=4.50", "trl>=0.17", "peft>=0.14", "accelerate>=1.2"]

[project.scripts]
playbook-demo = "playbook_legal.demo:main"
playbook-eval = "playbook_legal.cli:main"
playbook-lint = "playbook_legal.lint:main"
playbook-critic = "playbook_legal.critic:main"
playbook-export = "playbook_legal.export:main"
playbook-dataset = "playbook_legal.dataset:main"
playbook-dataset-check = "playbook_legal.dataset:verify_main"
playbook-dataset-freeze = "playbook_legal.freeze:main"
playbook-dataset-freeze-check = "playbook_legal.freeze:verify_main"
playbook-decision-pairs = "playbook_legal.preferences:main"
playbook-decision-pairs-check = "playbook_legal.preferences:verify_main"
playbook-experiment-check = "playbook_legal.experiment:main"
playbook-analysis = "playbook_legal.analysis:main"
playbook-variants = "playbook_legal.variants:main"
playbook-variants-build = "playbook_legal.variants:catalog_main"
playbook-render = "playbook_legal.render:main"
playbook-baseline = "playbook_legal.baseline:main"
playbook-bench = "playbook_legal.bench:main"
playbook-baseline-sprint = "playbook_legal.baseline_sprint:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
# The repo's datasets/ directory (variant family catalog) must not shadow the
# HuggingFace `datasets` package in import classification.
known-third-party = ["datasets"]

[tool.ruff.lint.per-file-ignores]
"training/*" = ["E402"]
