[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "playbook-legal"
version = "0.1.0"
description = "An open environment for evaluating and training AI agents on realistic legal work."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "James Baker" }]
dependencies = ["PyYAML>=6.0"]
keywords = ["legal-ai", "reinforcement-learning", "agents", "evaluation", "contracts"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
gym = ["gymnasium>=1.0"]
train = ["datasets>=3", "transformers>=4.50", "trl>=0.17", "peft>=0.14", "accelerate>=1.2"]

[project.scripts]
playbook-demo = "playbook_legal.demo:main"
playbook-eval = "playbook_legal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
