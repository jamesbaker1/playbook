[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "playbook-legal"
version = "0.3.0"
description = "An open environment for evaluating and training AI agents on realistic legal work."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [{ name = "James Baker" }]
dependencies = ["PyYAML>=6.0"]
keywords = ["legal-ai", "reinforcement-learning", "agents", "evaluation", "contracts"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
baselines = ["openai>=1.40"]
gym = ["gymnasium>=1.0"]
train = ["datasets>=3", "transformers>=4.50", "trl>=0.17", "peft>=0.14", "accelerate>=1.2"]

[project.scripts]
playbook-demo = "playbook_legal.demo:main"
playbook-eval = "playbook_legal.cli:main"
playbook-lint = "playbook_legal.lint:main"
playbook-export = "playbook_legal.export:main"
playbook-render = "playbook_legal.render:main"
playbook-baseline = "playbook_legal.baseline:main"
playbook-bench = "playbook_legal.bench:main"
playbook-baseline-sprint = "playbook_legal.baseline_sprint:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"training/*" = ["E402"]
