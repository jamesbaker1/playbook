name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,gym]"
      - name: Ruff
        run: ruff check src tests training compiler
      - name: Verify engine Worker vendor bundle
        run: python engine-worker/vendor.py --check
      - name: Tests
        run: pytest -q
      - name: Lint matters
        run: python -m playbook_legal.lint --all matters
