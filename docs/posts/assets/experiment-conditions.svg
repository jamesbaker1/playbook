<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 856" role="img" aria-labelledby="fig3-title fig3-desc" font-family="ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace">
  <title id="fig3-title">Playbook-1: the five frozen conditions, the four release gates that compare state_action_sft with final_answer_sft, and the prerequisite that locks the DPO condition.</title>
  <desc id="fig3-desc">Three conditions train or evaluate from playbook_1_base — base (no training), final_answer_sft and state_action_sft — while external_reference sits apart as the open-weight teacher reference, not a training control. Four release gates compare state_action_sft against final_answer_sft: critical_failure_rate (the primary gate, decided by a one-sided cluster-bootstrap CI excluding zero at 95 per cent), citation_validity with maximum regression 0.01, fabricated_quote_count with maximum regression 0, and completion_rate with maximum regression 0.02. state_action_sft_dpo is locked behind the prerequisite state_action_sft_clears_release_gates. Beating base is secondary reporting, not a gate.</desc>

  <defs>
    <marker id="ink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#1a1916"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="856" fill="#f7f5f0"/>

  <!-- ============================================================= header -->
  <text x="40" y="38" font-size="15" fill="#1a1916">Playbook-1 — five frozen conditions and four release gates</text>
  <text x="40" y="60" font-size="11" fill="#8a857a">docs/playbook-1-experiment.yaml  ·  schema_version: playbook.experiment.v1  ·  status: frozen</text>

  <!-- ========================================================= conditions -->
  <text x="40" y="92" font-size="11" fill="#8a857a" letter-spacing="0.08em">CONDITIONS</text>
  <text x="888" y="92" font-size="11" fill="#8a857a" letter-spacing="0.08em">SET APART — NOT A TRAINING CONDITION</text>

  <rect x="40" y="104" width="249" height="152" fill="#f7f5f0" stroke="#d8d4ca" stroke-width="1"/>
  <text x="54" y="130" font-size="13" fill="#1a1916">base</text>
  <text x="54" y="152" font-size="11" fill="#8a857a">training_view: none</text>
  <text x="54" y="170" font-size="11" fill="#8a857a">base_model_group: playbook_1_base</text>
  <text x="54" y="194" font-size="11" fill="#8a857a">no training —</text>
  <text x="54" y="210" font-size="11" fill="#8a857a">the untrained control</text>

  <rect x="313" y="104" width="249" height="152" fill="#f7f5f0" stroke="#d8d4ca" stroke-width="1"/>
  <text x="327" y="130" font-size="13" fill="#1a1916">final_answer_sft</text>
  <text x="327" y="152" font-size="11" fill="#8a857a">training_view: final_answer</text>
  <text x="327" y="170" font-size="11" fill="#8a857a">base_model_group: playbook_1_base</text>
  <text x="327" y="194" font-size="11" fill="#8a857a">teacher_model_group:</text>
  <text x="327" y="210" font-size="11" fill="#8a857a" xml:space="preserve">  playbook_1_teacher</text>
  <text x="327" y="230" font-size="11" fill="#8a857a">token_budget_group:</text>
  <text x="327" y="246" font-size="11" fill="#8a857a" xml:space="preserve">  matched_sft_budget</text>

  <rect x="586" y="104" width="249" height="152" fill="#f7f5f0" stroke="#d8d4ca" stroke-width="1"/>
  <text x="600" y="130" font-size="13" fill="#1a1916">state_action_sft</text>
  <text x="600" y="152" font-size="11" fill="#8a857a">training_view: state_action</text>
  <text x="600" y="170" font-size="11" fill="#8a857a">base_model_group: playbook_1_base</text>
  <text x="600" y="194" font-size="11" fill="#8a857a">teacher_model_group:</text>
  <text x="600" y="210" font-size="11" fill="#8a857a" xml:space="preserve">  playbook_1_teacher</text>
  <text x="600" y="230" font-size="11" fill="#8a857a">token_budget_group:</text>
  <text x="600" y="246" font-size="11" fill="#8a857a" xml:space="preserve">  matched_sft_budget</text>

  <line x1="862" y1="92" x2="862" y2="256" stroke="#d8d4ca" stroke-width="1"/>

  <rect x="888" y="104" width="312" height="152" fill="#f7f5f0" stroke="#d8d4ca" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="904" y="130" font-size="13" fill="#1a1916">external_reference</text>
  <text x="904" y="152" font-size="11" fill="#8a857a">training_view: none</text>
  <text x="904" y="170" font-size="11" fill="#8a857a">model_group: playbook_1_teacher</text>
  <text x="904" y="194" font-size="11" fill="#8a857a">role: open_weight_teacher_</text>
  <text x="904" y="210" font-size="11" fill="#8a857a" xml:space="preserve">      reference_not_training_control</text>
  <text x="904" y="234" font-size="11" fill="#8a857a">teacher_model: null —</text>
  <text x="904" y="250" font-size="11" fill="#8a857a">pending_owner_approval</text>

  <text x="40" y="280" font-size="11" fill="#8a857a">playbook_1_base: Qwen/Qwen2.5-14B-Instruct</text>

  <!-- comparison bracket -->
  <path d="M438,256 L438,282 L710,282 L710,256" fill="none" stroke="#1a1916" stroke-width="1"/>
  <line x1="574" y1="282" x2="574" y2="310" stroke="#1a1916" stroke-width="1" marker-end="url(#ink-arrow)"/>
  <text x="726" y="286" font-size="11" fill="#8a857a">every release gate compares these two</text>

  <!-- ====================================================== release gates -->
  <text x="40" y="308" font-size="11" fill="#8a857a" letter-spacing="0.08em">RELEASE GATES — ALL FOUR MUST CLEAR</text>

  <rect x="40" y="316" width="1160" height="240" fill="#f7f5f0" stroke="#d8d4ca" stroke-width="1"/>
  <line x1="40" y1="376" x2="1200" y2="376" stroke="#d8d4ca" stroke-width="1"/>
  <line x1="40" y1="436" x2="1200" y2="436" stroke="#d8d4ca" stroke-width="1"/>
  <line x1="40" y1="496" x2="1200" y2="496" stroke="#d8d4ca" stroke-width="1"/>
  <rect x="40" y="316" width="4" height="60" fill="#b3372c"/>

  <text x="64" y="342" font-size="12" fill="#1a1916">critical_failure_rate</text>
  <text x="348" y="342" font-size="11" fill="#8a857a">state_action_sft_lt_final_answer_sft</text>
  <text x="708" y="342" font-size="11" fill="#8a857a">one_sided_cluster_bootstrap_ci_excludes_zero</text>
  <text x="64" y="362" font-size="11" fill="#b3372c">PRIMARY RELEASE GATE</text>
  <text x="348" y="362" font-size="11" fill="#8a857a">direction: minimize · tolerance: 0</text>
  <text x="708" y="362" font-size="11" fill="#8a857a">confidence_level: 0.95 · resampling_unit: matter_family</text>

  <text x="64" y="402" font-size="12" fill="#1a1916">citation_validity</text>
  <text x="348" y="402" font-size="11" fill="#8a857a">state_action_sft_vs_final_answer_sft</text>
  <text x="708" y="402" font-size="11" fill="#8a857a">maximum_regression: 0.01</text>
  <text x="348" y="422" font-size="11" fill="#8a857a">direction: maximize</text>

  <text x="64" y="462" font-size="12" fill="#1a1916">fabricated_quote_count</text>
  <text x="348" y="462" font-size="11" fill="#8a857a">state_action_sft_vs_final_answer_sft</text>
  <text x="708" y="462" font-size="11" fill="#8a857a">maximum_regression: 0</text>
  <text x="348" y="482" font-size="11" fill="#8a857a">direction: minimize</text>

  <text x="64" y="522" font-size="12" fill="#1a1916">completion_rate</text>
  <text x="348" y="522" font-size="11" fill="#8a857a">state_action_sft_vs_final_answer_sft</text>
  <text x="708" y="522" font-size="11" fill="#8a857a">maximum_regression: 0.02</text>
  <text x="348" y="542" font-size="11" fill="#8a857a">direction: maximize</text>

  <line x1="574" y1="556" x2="574" y2="588" stroke="#1a1916" stroke-width="1" marker-end="url(#ink-arrow)"/>

  <!-- ======================================================= the lock -->
  <text x="40" y="584" font-size="11" fill="#8a857a" letter-spacing="0.08em">PREREQUISITE</text>
  <rect x="40" y="592" width="1160" height="72" fill="#f7f5f0" stroke="#1a1916" stroke-width="1.5"/>

  <path d="M74,628 L74,620 A6,6 0 0 1 86,620 L86,628" fill="none" stroke="#1a1916" stroke-width="1.5"/>
  <rect x="68" y="628" width="24" height="20" fill="none" stroke="#1a1916" stroke-width="1.5"/>
  <circle cx="80" cy="636" r="2" fill="#1a1916"/>

  <text x="112" y="624" font-size="12" fill="#1a1916">prerequisite: state_action_sft_clears_release_gates</text>
  <text x="112" y="646" font-size="11" fill="#8a857a">the DPO condition does not run until all four gates above clear</text>

  <line x1="574" y1="664" x2="574" y2="690" stroke="#1a1916" stroke-width="1" marker-end="url(#ink-arrow)"/>

  <!-- ============================================== dpo box + side note -->
  <rect x="380" y="692" width="320" height="104" fill="#f7f5f0" stroke="#d8d4ca" stroke-width="1"/>
  <text x="396" y="718" font-size="13" fill="#1a1916">state_action_sft_dpo</text>
  <text x="396" y="740" font-size="11" fill="#8a857a">training_view: state_action</text>
  <text x="396" y="758" font-size="11" fill="#8a857a">base_model_group: playbook_1_base</text>
  <text x="396" y="780" font-size="11" fill="#8a857a">no teacher or budget group declared</text>

  <rect x="740" y="692" width="460" height="104" fill="#f7f5f0" stroke="#d8d4ca" stroke-width="1" stroke-dasharray="4 3"/>
