  <text x="756" y="780" font-size="11" fill="#8a857a">purpose: guard_against_degraded_control_tool_use</text>

  <text x="40" y="828" font-size="12" fill="#8a857a">frozen 2026-08-06; teacher and budget fields null pending approval</text>
