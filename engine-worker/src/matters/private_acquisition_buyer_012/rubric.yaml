critical_failure_score_cap: 0.25
questions:
  - id: q_billing_audit
    points: 0.5
    concepts: ["billing audit", "knowledge"]
    aliases: [["payer audit", "executives"], ["coding audit", "awareness"]]
  - id: q_reserve_pricing
    points: 0.5
    concepts: ["reserve", "basket"]
    aliases: [["price", "deductible"], ["risk reserve", "first dollar"]]
escalations:
  - id: esc_basket_form
    points: 0.5
    concepts: ["tipping basket", "deductible"]
    aliases: [["first dollar", "basket"], ["basket", "economic form"]]
    required: true
    critical_if_missed: false
issues:
  - id: knowledge_inquiry
    anchor: "purchase §4.8"
    severity: high
    base_points: 1.0
    severity_points: 0.25
    citation_points: 0.25
    concept_points: 0.5
    quote_points: 0.25
    redline_points: 0.25
    settlement_points: 0.75
    required_citations: ["purchase §4.8", "mandate §1"]
    required_concepts: ["actual", "reasonable inquiry", "direct reports"]
    redline_concepts: ["reasonable inquiry", "direct reports"]
    # The sin is preserving purchase §4.8's no-inquiry knowledge qualifier. Because the
    # pattern contains its own negator ("without"), negation_guard would suppress every
    # match, so the leading-negator case is written out longhand in exclude_context.
    redline_critical_failure_patterns:
      - pattern: "without inquiry"
        exclude_context: '["“][^"”]*["”][^.]{0,24}\b(?:struck|stricken|deleted|removed|replaced)\b|\b(?:no|not|never|nothing|none|neither|nor|cannot)\b[^.]*without inquiry'
      - pattern: 'no duty to (?:make )?inquir\w*|no inquiry obligation'
        exclude_context: '["“][^"”]*["”][^.]{0,24}\b(?:struck|stricken|deleted|removed|replaced)\b'
    settlement_concepts: ["reasonable inquiry", "direct reports"]
    settlement_critical_failure_patterns:
      - pattern: "without inquiry"
        exclude_context: '["“][^"”]*["”][^.]{0,24}\b(?:struck|stricken|deleted|removed|replaced)\b|\b(?:no|not|never|nothing|none|neither|nor|cannot)\b[^.]*without inquiry'
      - pattern: 'no duty to (?:make )?inquir\w*|no inquiry obligation'
        exclude_context: '["“][^"”]*["”][^.]{0,24}\b(?:struck|stricken|deleted|removed|replaced)\b'
  - id: basket_form
    anchor: "purchase §10.2"
    severity: high
    base_points: 1.0
    severity_points: 0.25
    citation_points: 0.25
    concept_points: 0.5
    quote_points: 0.25
    redline_points: 0.25
    settlement_points: 1.0
    required_citations: ["purchase §10.2", "mandate §2"]
    required_concepts: ["first dollar", "deductible", "$1.5 million"]
    redline_concepts: ["above", "$1.5 million"]
    # The sin is the prohibited first-dollar tipping basket. Correct work negates it
    # ("no losses are recoverable from the first dollar") or quotes the struck words of
    # §10.2, so both guards apply; the second entry closes the hyphen / "dollar one" /
    # "initial $1.5 million layer" restatements of the same sin.
    redline_critical_failure_patterns:
      - pattern: "all losses from the first dollar"
        negation_guard: true
        exclude_context: '["“][^"”]*["”][^.]{0,24}\b(?:struck|stricken|deleted|removed|replaced)\b'
      - pattern: 'first-dollar|dollar one|all losses,? including the (?:initial|first) \$1\.5 million'
        negation_guard: true
        exclude_context: '["“][^"”]*["”][^.]{0,24}\b(?:struck|stricken|deleted|removed|replaced)\b'
    non_negotiable: true
    settlement_concepts: ["above", "$1.5 million"]
    settlement_critical_failure_patterns:
      - pattern: "first dollar"
        negation_guard: true
        exclude_context: '["“][^"”]*["”][^.]{0,24}\b(?:struck|stricken|deleted|removed|replaced)\b'
      - pattern: 'first-dollar|dollar one|all losses,? including the (?:initial|first) \$1\.5 million'
        negation_guard: true
        exclude_context: '["“][^"”]*["”][^.]{0,24}\b(?:struck|stricken|deleted|removed|replaced)\b'
  - id: indemnity_cap
    anchor: "purchase §10.3"
    severity: high
    base_points: 1.0
    severity_points: 0.25
    citation_points: 0.25
    concept_points: 0.5
    quote_points: 0.25
    redline_points: 0.25
    settlement_points: 0.75
    required_citations: ["purchase §10.3", "mandate §3"]
    required_concepts: ["five percent", "7.5%", "special billing"]
    redline_concepts: ["7.5%", "special billing"]
    # The sin is closing at the sub-floor cap. negation_guard is deliberately NOT used:
    # §10.3 states the cap as "will not exceed five percent", so a negator before the
    # number is the sin's own phrasing. Only an express rejection ("not five percent")
    # or a quoted-and-replaced mention is excluded. The second entry closes the numeric
    # spellings of the same figure; the lookbehind keeps "7.5%" out of the match.
    redline_critical_failure_patterns:
      - pattern: "five percent"
        exclude_context: '["“][^"”]*["”][^.]{0,24}\b(?:struck|stricken|deleted|removed|replaced)\b|\b(?:not|rather than|instead of) (?:five|5)\b'
      - pattern: '(?<![\d.])5\s*(?:%|percent)|five \(5\) percent'
        exclude_context: '["“][^"”]*["”][^.]{0,24}\b(?:struck|stricken|deleted|removed|replaced)\b|\b(?:not|rather than|instead of) (?:five|5)\b'
    settlement_concepts: ["7.5%", "special billing"]
    settlement_critical_failure_patterns:
      - pattern: "five percent"
        exclude_context: '["“][^"”]*["”][^.]{0,24}\b(?:struck|stricken|deleted|removed|replaced)\b|\b(?:not|rather than|instead of) (?:five|5)\b'
      - pattern: '(?<![\d.])5\s*(?:%|percent)|five \(5\) percent'
        exclude_context: '["“][^"”]*["”][^.]{0,24}\b(?:struck|stricken|deleted|removed|replaced)\b|\b(?:not|rather than|instead of) (?:five|5)\b'
  - id: survival_period
    anchor: "purchase §10.4"
    severity: high
    base_points: 1.0
    severity_points: 0.25
    citation_points: 0.25
    concept_points: 0.5
    quote_points: 0.25
    redline_points: 0.25
    settlement_points: 0.75
    required_citations: ["purchase §10.4", "mandate §4"]
    required_concepts: ["nine months", "fifteen months", "twenty-four months"]
    redline_concepts: ["fifteen months", "twenty-four months"]
    # The sin is closing on Seller's sub-mandate survival period. Correct work names the
    # replaced words of §10.4 or cites mandate §4's own reason ("nine months does not
    # cover the payer audit cycle") — a trailing negator, so exclude_context, not
    # negation_guard. The second entry closes the numeric / hyphenated / "one year"
    # spellings of the same two periods.
    redline_critical_failure_patterns:
      - pattern: "nine months|twelve months"
        exclude_context: '["“][^"”]*["”][^.]{0,24}\b(?:struck|stricken|deleted|removed|replaced)\b|\bmonths? (?:does|do|would) not\b'
      - pattern: '(?<![\d.])(?:9|12) months?|(?:nine|twelve)-month|(?:nine|twelve) \(\d+\) months?|\bone[- ]year\b'
        exclude_context: '["“][^"”]*["”][^.]{0,24}\b(?:struck|stricken|deleted|removed|replaced)\b|\bmonths? (?:does|do|would) not\b'
    settlement_concepts: ["fifteen months", "twenty-four months"]
    settlement_critical_failure_patterns:
      - pattern: "nine months|twelve months"
        exclude_context: '["“][^"”]*["”][^.]{0,24}\b(?:struck|stricken|deleted|removed|replaced)\b|\bmonths? (?:does|do|would) not\b'
      - pattern: '(?<![\d.])(?:9|12) months?|(?:nine|twelve)-month|(?:nine|twelve) \(\d+\) months?|\bone[- ]year\b'
        exclude_context: '["“][^"”]*["”][^.]{0,24}\b(?:struck|stricken|deleted|removed|replaced)\b|\bmonths? (?:does|do|would) not\b'
final_submission:
  points: 0.75
  minimum_characters: 220
  required_issue_ids: [knowledge_inquiry, basket_form, indemnity_cap, survival_period]
  missing_required_issue_penalty: 0.25
  missed_escalation_penalty: 0.5
  required_concepts: ["reasonable inquiry", "deductible", "7.5%", "twenty-four months"]
  concept_points: 0.5
